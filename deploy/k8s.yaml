apiVersion: apps/v1
kind: Deployment
metadata: { name: secretsweep, labels: { app: secretsweep } }
spec:
  replicas: 1
  selector: { matchLabels: { app: secretsweep } }
  template:
    metadata: { labels: { app: secretsweep } }
    spec:
      containers:
        - name: secretsweep
          image: ghcr.io/cognis-digital/secretsweep:latest
          ports: [{ containerPort: 8000 }]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: secretsweep }
spec:
  selector: { app: secretsweep }
  ports: [{ port: 80, targetPort: 8000 }]
